name: Discord updates

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, closed, synchronize]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK;
            const event = context.eventName;
            const payload = context.payload;

            let embed = {};

            if (event === "push") {
              const branch = context.ref.replace("refs/heads/", "");
              const commits = payload.commits || [];
              const commitList = commits
                .slice(0, 10)
                .map(c => `• ${c.message.split("\n")[0]} by ${c.author.name}`)
                .join("\n");

              embed = {
                title: `Push to ${branch}`,
                description: `${payload.pusher.name} pushed ${commits.length} commit${commits.length === 1 ? "" : "s"}\n\n${commitList || "No commit message found."}`,
                url: payload.compare,
                color: 3447003,
                footer: {
                  text: context.repo.owner + "/" + context.repo.repo
                },
                timestamp: new Date().toISOString()
              };
            }

            if (event === "pull_request") {
              const pr = payload.pull_request;
              const merged = pr.merged;
              const action = payload.action;

              embed = {
                title: merged ? `Pull Request Merged #${pr.number}` : `Pull Request ${action} #${pr.number}`,
                description: `"${pr.title}"\n\n${pr.head.ref} → ${pr.base.ref}\n\nAuthor: ${pr.user.login}`,
                url: pr.html_url,
                color: merged ? 3066993 : 15105570,
                footer: {
                  text: context.repo.owner + "/" + context.repo.repo
                },
                timestamp: new Date().toISOString()
              };
            }

            await fetch(webhook, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                username: "GitHub Updates",
                embeds: [embed]
              })
            });